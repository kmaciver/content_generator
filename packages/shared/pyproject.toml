[project]
name = "videoforge-shared"
version = "0.1.0"
description = "Cross-cutting primitives: ULIDs, structured logging, correlation, hashing, storage client."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    # Runtime dependency of the providers.yaml settings layer, not just tooling.
    "PyYAML==6.0.3",
    # ULIDs: sortable, URL-safe primary keys (SADD §10.2).
    "python-ulid==4.0.1",
    # S3 client for MinIO. boto3 rather than the minio SDK so the eventual
    # MinIO→S3 move stays a pure endpoint-config change (SADD §7.4, §24).
    "boto3==1.43.60",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videoforge_shared"]
