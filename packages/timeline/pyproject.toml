description = "Pure compiler: approved artifacts -> Timeline JSON. No I/O, fully unit-testable."
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videoforge_timeline"]
