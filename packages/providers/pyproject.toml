[project]
name = "videoforge-providers"
version = "0.1.0"
description = "Provider protocols and adapters. The only external boundary in the system."
requires-python = ">=3.12,<3.13"
dependencies = [
    # Anthropic SDK (M2-06). Imported only inside `anthropic_adapter`, which is
    # reached only when that adapter is selected — so a mock/replay deployment
    # never touches it.
    "anthropic==0.75.0",
    # Gemini image generation (M3-04). Imported only inside `google_adapter`,
    # reached only when that adapter is selected — a mock or Anthropic-only
    # deployment never loads it.
    "google-genai==1.46.0",
    # Request/result models. No SDK type crosses this boundary (SADD §15.2).
    "pydantic==2.13.4",
    # Provider *selection* and the ProviderKeys type. Note the registry takes
    # keys as an argument rather than resolving them, so nothing here can read
    # a secret on its own (NF8).
    "videoforge-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videoforge_providers"]
