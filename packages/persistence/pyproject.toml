[project]
name = "videoforge-persistence"
version = "0.1.0"
description = "SQLAlchemy base, engine factories, and (from M1) the ORM models and repositories."
requires-python = ">=3.12,<3.13"
dependencies = [
    "SQLAlchemy==2.0.51",
    "alembic==1.18.5",
    # psycopg3, binary build: sync today (Flask + Celery prefork are both
    # synchronous); the same driver serves async later if anything needs it.
    "psycopg[binary]==3.3.4",
    "videoforge-shared",
    # The pipeline graph and phase rules. persistence -> domain -> shared is
    # acyclic, and the direction matters: ADR-015 rejects domain depending on
    # persistence (it would drag SQLAlchemy into the pure layer), not this.
    # `phase` and `stale_since` are caches over artifact truth, so maintaining
    # them belongs beside the rows, while the rules stay pure.
    "videoforge-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videoforge_persistence"]
