[project]
name = "videoforge-domain"
version = "0.1.0"
description = "Pure workflow rules: artifact and job state machines, approval policy."
requires-python = ">=3.12,<3.13"
# Deliberately minimal. `videoforge-shared` is here only for the state
# vocabulary (`videoforge_shared.enums`), which itself depends on nothing.
#
# There is NO SQLAlchemy, NO Flask, NO Celery, and there must never be. The
# entire value of this package is that the rules can be tested without a
# database, a broker, or a request — SADD §10.1's "DB-free domain tests". A
# dependency added here is a claim that a workflow rule needs infrastructure
# to be expressed, which would be worth arguing about in an ADR first.
dependencies = [
    "videoforge-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videoforge_domain"]
