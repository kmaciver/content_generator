[project]
name = "videoforge-workers"
version = "0.1.0"
description = "Celery workers — the execution plane. Consume, call providers, persist, publish, exit."
requires-python = ">=3.12,<3.13"
dependencies = [
    # [redis] extra pulls redis-py + kombu's redis transport.
    "celery[redis]==5.6.3",
    "videoforge-shared",
]

# Celery arrives with M0-08; providers/prompts/timeline with M2-M4. Kept empty
# now so the dependency set stays honest about what is actually used.
#
# Note that render is a task in *this* app, not a separate service (D4): the
# FFmpeg renderer runs on the `render` queue through the same task skeleton as
# every other stage, which is what removed the callback and stream machinery.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videoforge_workers"]
