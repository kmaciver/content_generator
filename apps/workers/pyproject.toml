[project]
name = "videoforge-workers"
version = "0.1.0"
description = "Celery workers — the execution plane. Consume, call providers, persist, publish, exit."
requires-python = ">=3.12,<3.13"
dependencies = [
    # [redis] extra pulls redis-py + kombu's redis transport.
    "celery[redis]==5.6.3",
    "videoforge-shared",
    # M1-04: the task skeleton claims jobs and writes artifact versions, so
    # workers reach the database directly (SADD §13) — which is why the data
    # layer lives in packages/ rather than under the backend (ADR-013).
    "videoforge-persistence",
    # M1-04: the skeleton asks the job FSM whether a failure may retry, and
    # stage tasks drive the artifact FSM on success (ADR-015).
    "videoforge-domain",
    # M2-05: stages render their prompts from versioned templates, and pin
    # the resulting ref onto every version they write (§10.3 rule 4).
    "videoforge-prompts",
    # M1-06/07: stage tasks call providers. Workers are the ONLY tier that
    # does — provider keys never reach the API or the frontend (NF8).
    "videoforge-providers",
]

# Celery arrives with M0-08; providers/prompts/timeline with M2-M4. Kept empty
# now so the dependency set stays honest about what is actually used.
#
# Note that render is a task in *this* app, not a separate service (D4): the
# FFmpeg renderer runs on the `render` queue through the same task skeleton as
# every other stage, which is what removed the callback and stream machinery.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videoforge_workers"]
