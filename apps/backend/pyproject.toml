[project]
name = "videoforge-backend"
version = "0.1.0"
description = "Flask API — the control plane. Creates jobs and reads state; never generates."
requires-python = ">=3.12,<3.13"
dependencies = [
    "Flask==3.1.3",
    "videoforge-shared",
    "videoforge-persistence",
    # M1-04: services consult the artifact and job FSMs, and the API renders
    # the same guards into its capabilities payload so buttons never lie
    # (ADR-015).
    "videoforge-domain",
    # M3-06: the series branding endpoints compile a style preset's fields into
    # its prompt block on write, so the stored block is the one that actually
    # reaches a provider (§10.3 rule 4). Templating only — no provider, no key.
    "videoforge-prompts",
    # M1-04: the API publishes jobs to the broker. Producer only — it sends by
    # NAME (videoforge_shared.tasks) because importing the worker tasks would
    # break the apps -> packages rule. It therefore cannot execute a task even
    # by accident, which is the property worth having.
    "celery[redis]==5.6.3",
]

# uWSGI is deliberately NOT a project dependency. It is a deployment concern
# installed in the runtime image (see apps/backend/Dockerfile and ADR-002);
# putting it here would force a C compile on every developer's machine and on
# every test run.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videoforge"]
