; uWSGI configuration for the API socket (SADD 23.1).
;
; `strict` makes uWSGI reject unknown keys, so a typo fails startup rather than
; being silently ignored -- worth having first in the file.
[uwsgi]
strict = true
master = true

; No pythonpath needed: uv installs the workspace members into /opt/venv, which
; is on PATH, so `videoforge` is importable as a normal distribution.
module = videoforge.wsgi:app

; Process model: the API is deliberately thin (all slow work is in Celery), so
; this is sized for many short requests, not for compute. threads=2 because
; SQLAlchemy sessions are thread-scoped; enable-threads is required for the
; Python GIL machinery to be initialised at all.
processes = 4
threads = 2
enable-threads = true

; Initialise the app per worker after fork, so no DB/Redis file descriptors are
; ever shared across processes.
lazy-apps = true

; Unix socket rather than TCP: no port exposed, no loopback overhead. nginx
; reaches it through a shared volume.
;
; The process runs as `app` from the start -- there is no root phase and no
; privilege drop, so uid/gid/chown-socket are all absent deliberately. The image
; creates /run/uwsgi setgid (mode 2770, owned app:uwsgisock), so the socket
; inherits the uwsgisock group on creation. gid 2000 is the group nginx also
; joins, which is what makes mode 660 sufficient for both sides.
socket = /run/uwsgi/api.sock
chmod-socket = 660
vacuum = true

; Second listener, HTTP this time, for in-network service-to-service callers —
; the BFF is one (S6). nginx still uses the unix socket above (no HTTP hop),
; but the frontend cannot: it is a separate container, and a unix socket does
; not cross container boundaries.
;
; Without this, `backend:5000` resolves only under the development profile
; (Flask's dev server) and is ECONNREFUSED under production-local — dev and
; prod would disagree about the backend's internal address, which is precisely
; the drift the two-profile design exists to catch. Never published to the
; host; reachable only on the compose network.
http-socket = 0.0.0.0:5000

; Shutdown: Docker sends SIGTERM. uWSGI's default reaction to SIGTERM is a
; *reload*, which would make `docker stop` hang until the timeout, so die-on-term
; flips it to shutdown, and the hook makes workers finish in-flight requests
; instead of being killed mid-response.
die-on-term = true
hook-master-start = unix_signal:15 gracefully_kill_them_all

; A request that outlives harakiri is killed and its worker recycled. The API
; contract is p95 < 500ms (NF2), so 30s means "something is badly wrong".
harakiri = 30
harakiri-verbose = true

; Hygiene: recycle workers to bound the damage from any leak in a provider SDK.
max-requests = 1000
reload-on-rss = 512

buffer-size = 16384
post-buffering = 8192

; Structured request log. Correlation id arrives from nginx as X-Request-Id and
; is echoed here so an nginx line and a uWSGI line can be joined.
logformat = {"ts":"%(ltime)","level":"info","src":"uwsgi","method":"%(method)","uri":"%(uri)","status":%(status),"msecs":%(msecs),"pid":%(pid),"worker":%(wid),"req_id":"%(var.HTTP_X_REQUEST_ID)"}
log-x-forwarded-for = true
