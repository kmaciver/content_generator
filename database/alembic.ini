# Alembic configuration (SADD §10.4).
#
# Deliberately minimal: no sqlalchemy.url here — env.py builds it from the
# same PostgresSettings every service uses, so migrations always run against
# whatever the environment says, and credentials never live in an ini file.

[alembic]
script_location = %(here)s/migrations

# Timestamped, slugged filenames keep versions/ listable in creation order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# One head, always (SADD §10.4). Branching is refused at generation time.
# (Enforced socially + by `alembic check` in CI; noted here as policy.)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
