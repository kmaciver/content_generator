user  nginx;
worker_processes  auto;
error_log  /dev/stderr  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout  65;
    server_tokens  off;

    # Correlation id: reuse an inbound X-Request-Id if the caller supplied one,
    # otherwise mint nginx's own. Everything downstream (uWSGI logformat, and
    # later Celery task headers) keys off this single value.
    map $http_x_request_id $req_id {
        default  $http_x_request_id;
        ""       $request_id;
    }

    # SADD §21.7 — mostly protection against a runaway frontend loop locally.
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    # Send `Connection: upgrade` only when the client actually asked to
    # upgrade; a blanket value breaks keepalive for ordinary requests.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    log_format json_combined escape=json
        '{"ts":"$time_iso8601","level":"info","src":"nginx",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"req_id":"$req_id","upstream_ms":"$upstream_response_time",'
        '"bytes":$body_bytes_sent,"ua":"$http_user_agent"}';
    access_log  /dev/stdout  json_combined;

    # Binary uwsgi protocol over the shared unix socket -- no HTTP hop, no port.
    upstream api {
        server unix:/run/uwsgi/api.sock;
    }

    upstream s3 {
        server minio:9000;
    }

    upstream next {
        server frontend:3000;
    }

    server {
        listen  80;
        client_max_body_size  100m;

        add_header X-Content-Type-Options   nosniff                        always;
        add_header X-Frame-Options          DENY                           always;
        add_header Referrer-Policy          strict-origin-when-cross-origin always;

        # The BFF's own routes are served by Next, not Flask. nginx matches
        # the longest prefix, so this beats /api/ below. Without it the API
        # location swallows /api/bff/* and answers with Flask's 404.
        location /api/bff/ {
            proxy_pass         http://next;
            proxy_http_version 1.1;
            proxy_set_header   Host         $host;
            proxy_set_header   X-Request-Id $req_id;
        }

        location /api/ {
            limit_req    zone=api  burst=40  nodelay;
            include      uwsgi_params;
            uwsgi_pass   api;
            uwsgi_param  HTTP_X_REQUEST_ID  $req_id;

            # Deliberately longer than uWSGI's harakiri (30s) so that a stuck
            # request is killed by uWSGI and reported as 502, rather than nginx
            # timing out first and hiding which layer failed.
            uwsgi_read_timeout  60s;
        }

        # ------------------------------------------------------------------ #
        # Asset serving (B4/ADR-011): stable public URL -> API authorizes ->
        # X-Accel-Redirect -> internal presigned proxy to MinIO.
        # ------------------------------------------------------------------ #

        # Public entry. The rewrite lands in the /api/ location above, so the
        # request is authorized by Flask; the browser-visible URL stays
        # /assets/{bucket}/{content-key} — stable, hence cacheable forever.
        location /assets/ {
            rewrite  ^/assets/(.+)$  /api/v1/assets/$1  last;
        }

        # Reachable ONLY via X-Accel-Redirect (`internal`): a direct request
        # gets a 404 before any byte of storage is touched. The redirect
        # target carries the presigned query string, so MinIO still verifies
        # a real SigV4 signature on every fetch — nothing here is anonymous.
        location /internal-assets/ {
            internal;
            rewrite  ^/internal-assets/(.+)$  /$1  break;
            proxy_pass  http://s3;

            # The presign was computed against this exact host; anything else
            # is SignatureDoesNotMatch.
            proxy_set_header  Host  minio:9000;

            # Stream, don't spool: a 60s video must start flowing immediately.
            # Range passes through untouched, which is all MP4 scrubbing needs
            # given +faststart output (M0-09 verifies moov placement).
            proxy_buffering             off;
            proxy_http_version          1.1;
            proxy_set_header Connection "";

            # Immutable caching is CORRECT here, not optimistic: the key
            # embeds the content hash, so a changed asset is a different URL
            # by construction (SADD §18.2).
            add_header  Cache-Control  "public, max-age=31536000, immutable"  always;
            add_header  Accept-Ranges  bytes  always;

            # MinIO internals are not the browser's business.
            proxy_hide_header  x-amz-request-id;
            proxy_hide_header  x-amz-id-2;
            proxy_hide_header  x-minio-deployment-id;
        }

        # Everything else is the UI. Last, so /api/, /assets/ and
        # /internal-assets/ match first.
        location / {
            proxy_pass         http://next;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-Id      $req_id;
            # Upgrade headers so Next's dev HMR websocket survives a
            # proxied dev profile; harmless in production-local.
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
        }

        # Edge liveness, answered without touching the backend.
        location = /nginx-health {
            access_log  off;
            add_header  Content-Type  text/plain;
            return 200  "ok\n";
        }
    }
}
