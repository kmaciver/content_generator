# Redis serves three roles here: Celery broker, Celery result backend, and
# pub/sub fanout for the outbox drain (SADD §14).

# --------------------------------------------------------------------------- #
# Persistence
# --------------------------------------------------------------------------- #
# AOF with everysec is the compromise SADD §7.2 asks for: at most one second of
# acknowledged-but-unwritten data on a host crash, at a fraction of the cost of
# `always`. It matters because a queued-but-not-yet-started job lives only in
# Redis until a worker picks it up.
#
# This narrows the window; it does not close it. GenerationJob rows in Postgres
# are the durable record, and the reconciler re-enqueues anything Redis lost
# (SADD §14.4). Do not treat this file as the durability story on its own.
appendonly yes
appendfsync everysec
dir /data

# RDB snapshots alongside AOF: cheap insurance, and much faster to restore.
save 900 1
save 300 10
save 60 10000

# --------------------------------------------------------------------------- #
# Memory
# --------------------------------------------------------------------------- #
# noeviction is NOT a default worth inheriting by accident -- it is the single
# most important line in this file. Any eviction policy lets Redis silently drop
# keys under memory pressure, and for a broker that means silently dropping
# queued tasks. Failing writes loudly is strictly better than losing jobs.
maxmemory-policy noeviction

# --------------------------------------------------------------------------- #
# Logging
# --------------------------------------------------------------------------- #
loglevel notice
# Empty string = stdout, which is what Docker wants.
logfile ""
